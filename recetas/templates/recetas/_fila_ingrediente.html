{# Una fila de ingrediente (nombre/cantidad/unidad), reutilizada en DOS sitios de #}
{# formulario.html: una vez por cada fila ya conocida (server-side, con sus valores) y una vez #}
{# dentro de <template id="plantilla-fila-ingrediente"> (en blanco, para clonar por JS). Por #}
{# eso todo lo que se enseña sale del servidor con su `value=`/`selected` reales — Alpine.js #}
{# solo se usa para "Quitar" (ocultar + deshabilitar, `x-show`/`:disabled`), nunca para pintar #}
{# el valor: así lo que ve el cliente de pruebas de Django (sin ejecutar JS) es exactamente lo #}
{# que vería una persona con JS desactivado. #}
<div x-data="{ eliminada: false }" x-show="!eliminada" class="flex flex-wrap items-end gap-2">
  <div>
    <label class="block text-xs text-slate-500">Ingrediente</label>
    <input
      type="text" name="ingrediente_nombre" value="{{ fila.nombre }}" :disabled="eliminada"
      class="rounded border border-slate-300 px-2 py-1"
    >
  </div>
  <div>
    <label class="block text-xs text-slate-500">Cantidad</label>
    {# R5 — formato de MÁQUINA (punto): `fila.cantidad_texto` viene de `str(Decimal(...))`, #}
    {# que nunca usa coma (a diferencia de localizar un Decimal en la plantilla). #}
    <input
      type="number" step="0.01" min="0.01" name="ingrediente_cantidad"
      value="{{ fila.cantidad_texto }}" :disabled="eliminada"
      class="w-24 rounded border border-slate-300 px-2 py-1"
    >
  </div>
  <div>
    <label class="block text-xs text-slate-500">Unidad</label>
    <select name="ingrediente_unidad" :disabled="eliminada" class="rounded border border-slate-300 px-2 py-1">
      <option value=""></option>
      {% for valor, texto in unidades %}
        <option value="{{ valor }}" {% if valor == fila.unidad %}selected{% endif %}>{{ texto }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="button" @click="eliminada = true" class="font-medium text-red-700 hover:underline">
    Quitar
  </button>
</div>
