name: quality-security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # cada lunes a las 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        env:
          DJANGO_SECRET_KEY: valor-de-pega-solo-para-ci-nunca-un-secreto-real
          DB_NAME: kcalibra_ci
          DB_USER: kcalibra
          DB_PASSWORD: kcalibra
          DB_HOST: localhost
          DB_PORT: 5432
        run: scripts/ci/lint

  security:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Security
        env:
          DJANGO_SECRET_KEY: valor-de-pega-solo-para-ci-nunca-un-secreto-real
          DB_NAME: kcalibra_ci
          DB_USER: kcalibra
          DB_PASSWORD: kcalibra
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_DEBUG: "False"
        run: scripts/ci/security

  quality-security:
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: always()
    steps:
      - name: Resultado de lint y security
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "security: ${{ needs.security.result }}"
