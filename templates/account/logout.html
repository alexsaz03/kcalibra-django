{% extends "base.html" %}
{% block titulo %}Salir{% endblock %}
{% block content %}
<div class="mx-auto mt-16 max-w-sm px-6 text-center">
  <h1 class="text-2xl font-bold text-slate-900">¿Salir de KCalibra?</h1>
  <form method="post" action="{% url 'account_logout' %}" class="mt-6">
    {% csrf_token %}
    <button type="submit" class="w-full rounded-lg bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-700">
      Salir
    </button>
  </form>
</div>
{% endblock %}
